name: Feature Request
description: Propose a product or engineering enhancement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the operational or product problem this request solves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Change
      description: Describe the preferred solution and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define concrete completion criteria.
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: Rollout Considerations
      description: Note migrations, config changes, observability, and backwards compatibility concerns.
