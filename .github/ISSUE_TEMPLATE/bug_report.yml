name: Bug Report
description: Report a production or development defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide exact steps, inputs, and environment details.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe user, data, or operational impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and Evidence
      description: Include errors, screenshots, metrics, traces, or request IDs.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
